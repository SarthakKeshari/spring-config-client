apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greeting-service
  template:
    metadata:
      labels:
        app: greeting-service
    spec:
      containers:
        - name: greeting-service
          # Update this image field with your Docker Hub username and the image name
          image: sarthakkeshari/greeting-service:java21
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: greeting-service
spec:
  type: LoadBalancer
  selector:
    app: greeting-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8080
